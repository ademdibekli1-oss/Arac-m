<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0a1929">
<title>Araç-m · HTML Görüntüleyici & APK Dönüştürücü</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--bg:#0a1929;--bg2:#0f2438;--bg3:#163048;--line:#1f3d5c;--line2:#2d567a;
    --tx:#e0e8f0;--tx2:#8ba3bd;--tx3:#5a7a9a;--gold:#f0b429;--red:#e53e3e;
    --green:#38a169;--blue:#3182ce;--purple:#805ad5;--code-bg:#05101c}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{min-height:100vh;padding-bottom:40px}
  header{background:linear-gradient(135deg,#0f2438,#1a3a5c);border-bottom:2px solid var(--gold);
    padding:14px 16px 12px;position:sticky;top:0;z-index:50;box-shadow:0 4px 20px rgba(0,0,0,.5)}
  header h1{margin:0 0 4px;font-size:20px;letter-spacing:.5px}
  header h1 span{color:var(--gold)}
  header .sub{font-size:12px;color:var(--tx2)}
  nav{display:flex;gap:4px;overflow-x:auto;padding:0;border-bottom:1px solid var(--line);
    background:var(--bg2);scrollbar-width:none;position:sticky;top:62px;z-index:40}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:1 0 auto;padding:12px 14px;background:none;border:none;
    color:var(--tx2);font-size:13px;font-weight:600;cursor:pointer;
    border-bottom:3px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s}
  nav button:hover{color:var(--tx)}
  nav button.on{color:var(--gold);border-bottom-color:var(--gold)}
  main{max-width:900px;margin:0 auto;padding:16px}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
  .card h2{margin:0 0 10px;font-size:16px;color:var(--gold)}
  .card h3{margin:12px 0 8px;font-size:14px}
  .card h3:first-child{margin-top:0}
  .card p{margin:6px 0;font-size:13px;line-height:1.55;color:var(--tx2)}
  .dim{color:var(--tx3);font-size:12px}
  .ok{color:var(--green)}.bad{color:var(--red)}.gold{color:var(--gold)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;
    padding:10px 16px;border:1px solid var(--line2);border-radius:8px;
    background:var(--bg3);color:var(--tx);font-size:13px;font-weight:600;
    cursor:pointer;min-height:40px;transition:transform .08s,background .15s;text-decoration:none}
  .btn:hover{background:var(--line)}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--gold);color:#0a1929;border-color:var(--gold)}
  .btn.primary:hover{background:#f7c948}
  .btn.danger{background:var(--red);color:#fff;border-color:var(--red)}
  .btn.success{background:var(--green);color:#fff;border-color:var(--green)}
  .btn.info{background:var(--blue);color:#fff;border-color:var(--blue)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.sm{padding:6px 12px;min-height:32px;font-size:12px}
  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .row{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}
  .row>label{flex:1;min-width:120px;font-size:13px;color:var(--tx2)}
  input[type=text],input[type=color],select,textarea{padding:10px 12px;
    border:1px solid var(--line2);border-radius:8px;background:var(--bg3);
    color:var(--tx);font-family:inherit;font-size:14px;min-height:40px;width:100%}
  input[type=color]{min-width:60px;max-width:80px;padding:4px}
  textarea{font-family:ui-monospace,'Courier New',monospace;font-size:13px}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:-1px}
  .grid{display:grid;gap:10px}
  .grid.two{grid-template-columns:1fr 1fr}
  @media(max-width:520px){.grid.two{grid-template-columns:1fr}}
  .editor-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:-1px}
  .editor-tabs button{padding:8px 14px;background:var(--bg3);border:1px solid var(--line);
    border-bottom:none;color:var(--tx2);font-size:12px;border-radius:6px 6px 0 0;cursor:pointer}
  .editor-tabs button.on{background:var(--code-bg);color:var(--gold);font-weight:600}
  .editor-area{width:100%;min-height:180px;padding:12px;background:var(--code-bg);
    color:var(--tx);border:1px solid var(--line);border-radius:0 6px 6px 6px;
    font-family:ui-monospace,'Courier New',monospace;font-size:13px;line-height:1.5;
    resize:vertical;tab-size:2}
  .preview-wrap{position:relative;margin-top:12px;border:1px solid var(--line);
    border-radius:8px;overflow:hidden;background:#fff}
  .preview-wrap .controls{position:absolute;top:6px;right:6px;z-index:2;display:flex;gap:4px}
  .preview-wrap .controls button{padding:5px 9px;background:rgba(10,25,41,.85);
    color:#fff;border:none;border-radius:5px;font-size:11px;cursor:pointer}
  iframe.preview{width:100%;height:420px;border:none;display:block;background:#fff}
  .preview-wrap.fullscreen{position:fixed!important;inset:0;width:100vw!important;
    height:100vh!important;z-index:9999;border-radius:0}
  .preview-wrap.fullscreen .controls{top:10px;right:10px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
    background:var(--bg2);color:var(--tx);border:1px solid var(--line2);
    border-left:3px solid var(--blue);padding:10px 16px;border-radius:8px;
    font-size:13px;z-index:2000;box-shadow:0 6px 24px rgba(0,0,0,.5);
    animation:slideUp .25s ease}
  .toast.ok{border-left-color:var(--green)}
  .toast.bad{border-left-color:var(--red)}
  @keyframes slideUp{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
  .code-block{background:var(--code-bg);color:var(--tx);padding:12px;border-radius:8px;
    border:1px solid var(--line);font-family:ui-monospace,'Courier New',monospace;
    font-size:12px;overflow-x:auto;white-space:pre;line-height:1.5;margin:8px 0;
    position:relative;max-height:320px;overflow-y:auto}
  .code-block .copy-btn{position:sticky;top:0;float:right;margin-left:8px;
    padding:4px 9px;font-size:11px;background:var(--gold);color:#0a1929;
    border:none;border-radius:4px;cursor:pointer;font-weight:600}
  .steps{list-style:none;padding:0;margin:8px 0;counter-reset:step}
  .steps li{counter-increment:step;padding:10px 12px 10px 40px;position:relative;
    margin:6px 0;background:var(--bg3);border:1px solid var(--line);
    border-radius:8px;font-size:13px;line-height:1.5}
  .steps li::before{content:counter(step);position:absolute;left:10px;top:9px;
    width:22px;height:22px;border-radius:50%;background:var(--gold);color:#0a1929;
    font-weight:700;display:grid;place-items:center;font-size:12px}
  .chip{display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;
    background:var(--bg3);border:1px solid var(--line2);color:var(--tx2);margin-right:4px}
  footer{text-align:center;padding:20px;color:var(--tx3);font-size:12px;
    border-top:1px solid var(--line);margin-top:20px}
  footer a{color:var(--gold);text-decoration:none}
  footer a:hover{text-decoration:underline}
  details{background:var(--bg3);border:1px solid var(--line);border-radius:8px;
    padding:10px 14px;margin:8px 0}
  details summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--tx);padding:2px 0}
  details[open] summary{color:var(--gold);margin-bottom:8px}
  details p,details li{font-size:13px;color:var(--tx2);line-height:1.6}
  code{background:var(--code-bg);padding:1px 5px;border-radius:3px;
    font-family:ui-monospace,monospace;font-size:12px;color:var(--gold)}
  ul{padding-left:20px;margin:0}
  ul li{font-size:13px;line-height:1.7;color:var(--tx2)}
</style>
</head>
<body>
<header>
  <h1>⚙️ Araç-<span>m</span></h1>
  <div class="sub">Yama aracı · HTML Görüntüleyici · APK Dönüştürücü</div>
</header>
<nav id="nav">
  <button class="on" data-tab="html">🖥️ HTML Görüntüleyici</button>
  <button data-tab="pwa">📦 PWA / APK</button>
  <button data-tab="guide">📖 Rehber</button>
</nav>
<main id="main"></main>
<footer>Araç-m · <a href="https://ademdibekli1-oss.github.io/Arac-m/" target="_blank" rel="noopener">GitHub Pages</a></footer>
<div id="toasts"></div>

<script>
"use strict";

/* ==================== DURUM ==================== */
const A = {
  tab:'html',
  editorTab:'html',
  html:{
    code:{
      html:'<h1>Merhaba Dünya</h1>\n<p>Bu bir önizlemedir.</p>\n<button onclick="alert(\'Tıklandı!\')">Tıkla</button>',
      css:'body{font-family:system-ui;padding:20px;background:#fff;color:#333}\nh1{color:#c8102e}\nbutton{padding:8px 16px;background:#c8102e;color:#fff;border:none;border-radius:6px;cursor:pointer}',
      js:'console.log("Merhaba, konsol!");'
    },
    safe:true,
    fullscreen:false
  },
  pwa:{
    name:'Araç-m Uygulaması',
    short:'Araç-m',
    desc:'Araç-m ile oluşturulmuş uygulama',
    theme:'#0a1929',
    bg:'#0a1929',
    display:'standalone',
    startUrl:'./',
    iconEmoji:'⚙️',
    iconBg:'#0a1929',
    includeIndex:true,
    cacheName:'aracm-v1'
  },
  apk:{ mode:'pwa' }
};

/* ==================== YARDIMCILAR ==================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, type='info', dur=2600){
  const el = document.createElement('div');
  el.className = 'toast ' + (type === 'ok' ? 'ok' : type === 'bad' ? 'bad' : '');
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), dur);
}

function copyToClipboard(text){
  if(navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(text).then(()=>true).catch(()=>fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  }catch(e){ return false; }
}
function download(filename, content, mime='text/plain'){
  const blob = content instanceof Blob ? content : new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

/* ==================== SEKME YÖNETİMİ ==================== */
function renderNav(){
  document.querySelectorAll('#nav button').forEach(b=>{
    b.classList.toggle('on', b.dataset.tab === A.tab);
  });
}

function render(){
  renderNav();
  const fn = {html:renderHtml, pwa:renderPwa, guide:renderGuide}[A.tab] || renderHtml;
  $('main').innerHTML = fn();
  if(A.tab === 'html') bindHtmlEditor();
  if(A.tab === 'pwa')  bindPwaEvents();
}

/* ==================== HTML GÖRÜNTÜLEYİCİ ==================== */
function buildDoc(){
  const c = A.html.code;
  return '<!DOCTYPE html>\n<html lang="tr">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<style>\n'
    + c.css + '\n</style>\n</head>\n<body>\n' + c.html
    + '\n<script>\n' + c.js + '\n<\/script>\n</body>\n</html>';
}

function renderHtml(){
  const h = A.html;
  const tabs = ['html','css','js'].map(t =>
    `<button class="${h.editorTab===t?'on':''}" data-editor-tab="${t}">${t.toUpperCase()}</button>`
  ).join('');

  return `
  <div class="card">
    <h2>🖥️ HTML Görüntüleyici</h2>
    <p>HTML / CSS / JS kodunu yaz, önizle. Dosya yükleyebilir veya aşağıdaki örneği kullanabilirsin.</p>

    <div class="editor-tabs" style="margin-top:12px">${tabs}</div>
    <textarea class="editor-area" id="editor" spellcheck="false" autocomplete="off">${esc(h.code[h.editorTab])}</textarea>

    <div class="row">
      <label>Sandbox modu:</label>
      <select id="sandboxMode" style="max-width:300px">
        <option value="safe" ${h.safe?'selected':''}>🔒 Güvenli (sadece allow-scripts)</option>
        <option value="full" ${!h.safe?'selected':''}>⚠️ Tam (allow-scripts + allow-same-origin)</option>
      </select>
    </div>

    <div class="btns">
      <button class="btn primary" id="btnRender">▶️ Çalıştır</button>
      <button class="btn" id="btnFile">📂 Dosya Yükle</button>
      <button class="btn" id="btnDownload">💾 İndir (.html)</button>
      <button class="btn" id="btnCopy">📋 Kopyala</button>
      <button class="btn danger sm" id="btnClear">🗑️ Temizle</button>
      <input type="file" id="fileInput" accept=".html,.htm,.css,.js,.txt" style="display:none">
    </div>

    <div class="preview-wrap ${h.fullscreen?'fullscreen':''}" id="previewWrap">
      <div class="controls">
        <button id="btnFullscreen" type="button">⛶ Tam Ekran</button>
        <button id="btnReload" type="button">🔄</button>
      </div>
      <iframe class="preview" id="previewFrame"
        sandbox="${h.safe?'allow-scripts':'allow-scripts allow-same-origin'}"
        title="Önizleme"></iframe>
    </div>
  </div>

  <div class="card">
    <h2>💡 İpuçları</h2>
    <ul>
      <li><b>Güvenli mod</b>: Önizlenen kod ana sayfaya ve çerezlere erişemez. Test için önerilir.</li>
      <li><b>Tam mod</b>: Önizlenen kod kendi <code>localStorage</code>'ını kullanabilir. Sadece güvendiğin kodlar için.</li>
      <li><code>alert</code>, <code>console.log</code> gibi tarayıcı API'leri çalışır.</li>
      <li>Dosya yüklerken HTML seçersen HTML sekmesine, CSS seçersen CSS sekmesine, JS seçersen JS sekmesine yerleşir.</li>
      <li>İndirdiğin dosya <code>preview.html</code> olarak tarayıcıda açılabilir.</li>
    </ul>
  </div>`;
}

function updatePreview(){
  const f = $('previewFrame');
  if(f) f.srcdoc = buildDoc();
}

function bindHtmlEditor(){
  const ta = $('editor');
  if(!ta) return;

  let autoT = null;
  ta.addEventListener('input', () => {
    A.html.code[A.html.editorTab] = ta.value;
    clearTimeout(autoT);
    autoT = setTimeout(updatePreview, 400);
  });

  $('btnRender')?.addEventListener('click', () => {
    A.html.code[A.html.editorTab] = ta.value;
    updatePreview();
    toast('Önizleme güncellendi', 'ok');
  });

  $('btnFile')?.addEventListener('click', () => $('fileInput').click());

  $('fileInput')?.addEventListener('change', e => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const text = ev.target.result;
      const ext = (file.name.split('.').pop() || '').toLowerCase();
      if(ext === 'css'){ A.html.code.css = text; A.html.editorTab = 'css'; }
      else if(ext === 'js'){ A.html.code.js = text; A.html.editorTab = 'js'; }
      else { A.html.code.html = text; A.html.editorTab = 'html'; }
      render();
      toast(file.name + ' yüklendi', 'ok');
    };
    reader.readAsText(file);
  });

  $('btnDownload')?.addEventListener('click', () => {
    A.html.code[A.html.editorTab] = ta.value;
    download('preview.html', buildDoc(), 'text/html');
    toast('preview.html indirildi', 'ok');
  });

  $('btnCopy')?.addEventListener('click', () => {
    copyToClipboard(buildDoc()).then(ok => toast(ok?'Kod kopyalandı':'Kopyalama başarısız', ok?'ok':'bad'));
  });

  $('btnClear')?.addEventListener('click', () => {
    if(!confirm('Tüm editör içeriği silinsin mi?')) return;
    A.html.code = {html:'', css:'', js:''};
    render();
    toast('Temizlendi', 'ok');
  });

  $('btnFullscreen')?.addEventListener('click', () => {
    A.html.fullscreen = !A.html.fullscreen;
    $('previewWrap').classList.toggle('fullscreen', A.html.fullscreen);
    toast(A.html.fullscreen?'Tam ekran':'Normal mod', 'ok');
  });

  $('btnReload')?.addEventListener('click', () => { updatePreview(); toast('Yenilendi', 'ok'); });

  $('sandboxMode')?.addEventListener('change', e => {
    A.html.safe = e.target.value === 'safe';
    const f = $('previewFrame');
    if(f) f.setAttribute('sandbox', A.html.safe?'allow-scripts':'allow-scripts allow-same-origin');
    updatePreview();
  });

  updatePreview();
}

/* ==================== PWA / APK ==================== */
function renderPwa(){
  const p = A.pwa;
  return `
  <div class="card">
    <h2>📦 PWA Manifest Oluştur</h2>
    <p>Uygulama bilgilerini doldur, manifest.json ve service worker hazır kodu oluşturulsun.</p>

    <div class="grid two">
      <div>
        <label style="display:block;margin-bottom:4px;font-size:13px;color:var(--tx2)">Uygulama adı</label>
        <input type="text" id="pwaName" value="${esc(p.name)}">
      </div>
      <div>
        <label style="display:block;margin-bottom:4px;font-size:13px;color:var(--tx2)">Kısa ad</label>
        <input type="text" id="pwaShort" value="${esc(p.short)}">
      </div>
      <div>
        <label style="display:block;margin-bottom:4px;font-size:13px;color:var(--tx2)">Açıklama</label>
        <input type="text" id="pwaDesc" value="${esc(p.desc)}">
      </div>
      <div>
        <label style="display:block;margin-bottom:4px;font-size:13px;color:var(--tx2)">Başlangıç URL</label>
        <input type="text" id="pwaStart" value="${esc(p.startUrl)}">
      </div>
      <div>
        <label style="display:block;margin-bottom:4px;font-size:13px;color:var(--tx2)">Tema rengi</label>
        <input type="color" id="pwaTheme" value="${p.theme}">
      </div>
      <div>
        <label style="display:block;margin-bottom:4px;font-size:13px;color:var(--tx2)">Arka plan</label>
        <input type="color" id="pwaBg" value="${p.bg}">
      </div>
      <div>
        <label style="display:block;margin-bottom:4px;font-size:13px;color:var(--tx2)">Ekran modu</label>
        <select id="pwaDisplay">
          <option value="standalone" ${p.display==='standalone'?'selected':''}>Standalone (önerilen)</option>
          <option value="fullscreen" ${p.display==='fullscreen'?'selected':''}>Fullscreen</option>
          <option value="minimal-ui" ${p.display==='minimal-ui'?'selected':''}>Minimal UI</option>
          <option value="browser" ${p.display==='browser'?'selected':''}>Browser</option>
        </select>
      </div>
      <div>
        <label style="display:block;margin-bottom:4px;font-size:13px;color:var(--tx2)">İkon emoji</label>
        <input type="text" id="pwaIconEmoji" value="${esc(p.iconEmoji)}" maxlength="4">
      </div>
    </div>

    <div class="row" style="margin-top:10px">
      <label><input type="checkbox" id="pwaIncludeIndex" ${p.includeIndex?'checked':''}> index.html ekle (HTML Görüntüleyici içeriği)</label>
    </div>

    <div class="btns">
      <button class="btn primary" id="btnGenerate">⚙️ Manifest + SW Oluştur</button>
      <button class="btn success" id="btnDownloadPwa">📦 PWA ZIP İndir</button>
      <button class="btn info" id="btnOpenPwabuilder">🚀 PWABuilder'da Aç</button>
    </div>
  </div>

  <div class="card" id="pwaOutput" style="display:none">
    <h2>✅ Oluşturulan Dosyalar</h2>
    <div id="pwaFiles"></div>
  </div>

  <div class="card">
    <h2>📱 APK Dönüştürme Yöntemleri</h2>
    <p>PWA hazır olduğunda APK üretmek için dört yol var. Her biri için adım adım rehber ve hazır komutlar aşağıda.</p>

    <div class="btns" style="margin-bottom:12px">
      <button class="btn ${A.apk.mode==='pwa'?'primary':''}" data-apk="pwa">🥇 PWABuilder (Kolay)</button>
      <button class="btn ${A.apk.mode==='bubble'?'primary':''}" data-apk="bubble">🫧 Bubblewrap</button>
      <button class="btn ${A.apk.mode==='capacitor'?'primary':''}" data-apk="capacitor">⚡ Capacitor</button>
      <button class="btn ${A.apk.mode==='webview'?'primary':''}" data-apk="webview">🧩 Android WebView</button>
    </div>

    <div id="apkContent"></div>
  </div>

  <div class="card">
    <h2>📥 HTML ZIP Olarak İndir (APK için)</h2>
    <p>HTML Görüntüleyici'deki içeriği bir web sitesi olarak ZIP'leyip indir. Bu ZIP'i bir sunucuya atarsan PWA/APK için hazır olur.</p>
    <div class="btns">
      <button class="btn success" id="btnDownloadZip">📦 ZIP Olarak İndir</button>
    </div>
  </div>`;
}

function renderApkContent(){
  const mode = A.apk.mode;
  const el = $('apkContent');
  if(!el) return;

  const contents = {
    pwa: `
      <h3>🥇 PWABuilder (En Kolay)</h3>
      <p>Google'ın resmi aracı. Sitenin URL'sini ver, APK + AAB üretir.</p>
      <ol class="steps">

function buildManifest(){
  const p = A.pwa;
  const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="${p.iconBg}"/><text x="50%" y="55%" font-size="280" text-anchor="middle" dominant-baseline="middle">${p.iconEmoji}</text></svg>`;
  return {
    name: p.name,
    short_name: p.short,
    description: p.desc,
    start_url: p.startUrl,
    scope: './',
    display: p.display,
    orientation: 'portrait',
    background_color: p.bg,
    theme_color: p.theme,
    lang: 'tr',
    icons: [
      { src:'icon.svg', sizes:'any', type:'image/svg+xml', purpose:'any' },
      { src:'icon-maskable.svg', sizes:'any', type:'image/svg+xml', purpose:'maskable' }
    ],
    _iconSvg: iconSvg
  };
}

function buildServiceWorker(){
  return '// Araç-m tarafından oluşturuldu\n'
    + "const CACHE = '" + A.pwa.cacheName + "';\n"
    + "const ASSETS = ['./','./index.html','./manifest.json','./icon.svg'];\n\n"
    + "self.addEventListener('install', e => {\n"
    + "  e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)).then(() => self.skipWaiting()));\n"
    + "});\n\n"
    + "self.addEventListener('activate', e => {\n"
    + "  e.waitUntil(caches.keys().then(keys =>\n"
    + "    Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))\n"
    + "  ).then(() => self.clients.claim()));\n"
    + "});\n\n"
    + "self.addEventListener('fetch', e => {\n"
    + "  const req = e.request;\n"
    + "  if (req.method !== 'GET') return;\n"
    + "  if (new URL(req.url).origin !== location.origin) return;\n"
    + "  e.respondWith(fetch(req).then(res => {\n"
    + "    const copy = res.clone();\n"
    + "    caches.open(CACHE).then(c => c.put(req, copy));\n"
    + "    return res;\n"
    + "  }).catch(() => caches.match(req).then(m => m || caches.match('./index.html'))));\n"
    + "});\n";
}

function buildIndexHtml(){
  if(!A.pwa.includeIndex) return null;
  const c = A.html.code;
  return '<!DOCTYPE html>\n<html lang="tr">\n<head>\n<meta charset="UTF-8">\n'
    + '<meta name="viewport" content="width=device-width,initial-scale=1">\n'
    + '<title>' + esc(A.pwa.name) + '</title>\n'
    + '<meta name="theme-color" content="' + A.pwa.theme + '">\n'
    + '<link rel="manifest" href="manifest.json">\n'
    + '<link rel="icon" href="icon.svg" type="image/svg+xml">\n'
    + '<style>\n' + c.css + '\n</style>\n</head>\n<body>\n' + c.html
    + '\n<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}<\/script>\n'
    + '<script>\n' + c.js + '\n<\/script>\n</body>\n</html>';
}

function generatePwaFiles(){
  const manifest = buildManifest();
  const sw = buildServiceWorker();
  const html = buildIndexHtml();
  const files = {
    'manifest.json': JSON.stringify(manifest, null, 2),
    'sw.js': sw,
    'icon.svg': manifest._iconSvg,
    'icon-maskable.svg': manifest._iconSvg
  };
  if(html) files['index.html'] = html;
  return files;
}

function showPwaOutput(){
  const files = generatePwaFiles();
  const output = $('pwaOutput'), list = $('pwaFiles');
  if(!output || !list) return;

  list.innerHTML = Object.keys(files).map(name=>{
    const content = files[name];
    const preview = content.length > 3000 ? content.slice(0,3000) + '\n... (devamı)' : content;
    return `<details><summary>📄 ${name} <span class="dim">(${content.length} bayt)</span></summary>`
      + `<div class="code-block"><button class="copy-btn" data-copy="${esc(content)}">Kopyala</button>${esc(preview)}</div>`
      + `</details>`;
  }).join('');

  output.style.display = 'block';

  list.querySelectorAll('[data-copy]').forEach(b=>{
    b.addEventListener('click', ()=>{
      copyToClipboard(b.dataset.copy).then(ok => toast(ok?'Kopyalandı':'Başarısız', ok?'ok':'bad'));
    });
  });
  toast('Manifest + SW oluşturuldu', 'ok');
}

async function downloadPwaZip(){
  if(typeof JSZip === 'undefined'){ toast('JSZip yüklenemedi, tek tek kopyalayın', 'bad'); return; }
  const zip = new JSZip();
  const files = generatePwaFiles();
  for(const name in files) zip.file(name, files[name]);
  zip.file('README.txt',
    'Araç-m PWA paketi\n\n' +
    'Yükleme:\n' +
    '1. Bu klasördeki dosyaları bir web sunucusuna atın.\n' +
    '2. https://www.pwabuilder.com/ adresine gidip URL girin.\n' +
    '3. Android APK / AAB indirin.\n\n' +
    'Dosyalar:\n' +
    '- manifest.json: PWA kimlik ve ikonları\n' +
    '- sw.js: Service worker (offline)\n' +
    '- index.html: Ana sayfa\n' +
    '- icon.svg: Uygulama ikonu\n'
  );
  const blob = await zip.generateAsync({type:'blob'});
  download('aracm-pwa-' + Date.now() + '.zip', blob, 'application/zip');
  toast('PWA paketi indirildi', 'ok');
}

function bindPwaEvents(){
  const fields = {
    pwaName:'name', pwaShort:'short', pwaDesc:'desc',
    pwaStart:'startUrl', pwaTheme:'theme', pwaBg:'bg',
    pwaDisplay:'display', pwaIconEmoji:'iconEmoji'
  };
  for(const id in fields){
    const el = $(id); if(!el) continue;
    const handler = () => { A.pwa[fields[id]] = el.value; };
    el.addEventListener('input', handler);
    el.addEventListener('change', handler);
  }

  $('pwaIncludeIndex')?.addEventListener('change', e => { A.pwa.includeIndex = e.target.checked; });

  $('btnGenerate')?.addEventListener('click', showPwaOutput);
  $('btnDownloadPwa')?.addEventListener('click', downloadPwaZip);
  $('btnOpenPwabuilder')?.addEventListener('click', () => window.open('https://www.pwabuilder.com/', '_blank', 'noopener'));

  $('btnDownloadZip')?.addEventListener('click', async () => {
    if(typeof JSZip === 'undefined'){ toast('JSZip yüklenemedi', 'bad'); return; }
    const zip = new JSZip();
    zip.file('index.html', buildIndexHtml() || buildDoc());
    zip.file('manifest.json', JSON.stringify(buildManifest(), null, 2));
    zip.file('sw.js', buildServiceWorker());
    zip.file('icon.svg', buildManifest()._iconSvg);
    zip.file('README.txt', 'Araç-m ile oluşturulan web sitesi. PWA/APK için kullanılabilir.');
    const blob = await zip.generateAsync({type:'blob'});
    download('aracm-site-' + Date.now() + '.zip', blob, 'application/zip');
    toast('Site ZIP olarak indirildi', 'ok');
  });

  document.querySelectorAll('[data-apk]').forEach(b=>{
    b.addEventListener('click', ()=>{
      A.apk.mode = b.dataset.apk;
      render();
    });
  });

  renderApkContent();
}

document.addEventListener('click', e => {
  const navBtn = e.target.closest('#nav button[data-tab]');
  if(navBtn){
    A.tab = navBtn.dataset.tab;
    location.hash = A.tab;
    render();
    window.scrollTo(0,0);
    return;
  }

  const editorBtn = e.target.closest('[data-editor-tab]');
  if(editorBtn){
    if($('editor')) A.html.code[A.html.editorTab] = $('editor').value;
    A.html.editorTab = editorBtn.dataset.editorTab;
    render();
    return;
  }

  const apkBtn = e.target.closest('[data-apk]');
  if(apkBtn){
    A.apk.mode = apkBtn.dataset.apk;
    render();
    return;
  }
});

/* ==================== BAŞLAT ==================== */
function init(){
  if(location.hash){
    const t = location.hash.replace('#','');
    if(['html','pwa','guide'].includes(t)) A.tab = t;
  }
  render();
  window.addEventListener('hashchange', () => {
    const t = location.hash.replace('#','');
    if(['html','pwa','guide'].includes(t)){
      A.tab = t;
      render();
    }
  });
}

init();
